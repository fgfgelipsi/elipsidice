<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elipsi Dice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@500;700&display=swap">
<style>
/* Layout: one screen over a user background (photo/GIF); controls on top, frosted-glass tiles in the middle, a plain white "cover all" bar at the bottom; rarity counters below */
:root {
  --bg: #0e0f14;
  --panel: rgba(25, 27, 35, .62);
  --panel-solid: #191b23;
  --line: rgba(255, 255, 255, .14);
  --fg: #f2f3f7;
  --muted: #c3c6d4;
  --white: #ffffff;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html { height: 100%; }
body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
  gap: 16px;
  -webkit-tap-highlight-color: transparent;
}

/* background: default soft color field, replaced by the user's photo/GIF */
#bg {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(circle at 15% 20%, #2f7bff 0 10%, transparent 35%),
    radial-gradient(circle at 85% 15%, #ff3b4e 0 8%, transparent 32%),
    radial-gradient(circle at 20% 85%, #2ed47a 0 8%, transparent 32%),
    radial-gradient(circle at 80% 80%, #a855f7 0 10%, transparent 35%),
    radial-gradient(circle at 50% 50%, #ff8a1f 0 4%, transparent 25%),
    #14161e;
  background-size: cover; background-position: center;
}
#bg.photo { background-color: #000; }
#bg::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.18); }

header { display: flex; flex-direction: column; gap: 12px; align-items: center; }
h1 {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(22px, 6vw, 34px);
  margin: 0; letter-spacing: -0.01em; text-wrap: balance; text-align: center;
  text-shadow: 0 2px 14px rgba(0,0,0,.5);
}
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.glass {
  background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.picker { display: flex; gap: 6px; padding: 5px; border-radius: 14px; }
.picker button {
  font-family: var(--display); font-weight: 500; font-size: 17px;
  width: 46px; height: 44px; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted); cursor: pointer;
  transition: background .15s, color .15s;
}
.picker button[aria-pressed="true"] { background: var(--fg); color: #0e0f14; }
.pill {
  height: 56px; padding: 0 16px; border-radius: 14px; color: var(--fg);
  font-family: var(--body); font-weight: 700; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
}
.pill.small { padding: 0 14px; }
.pill[aria-pressed="true"] { background: var(--fg); color: #0e0f14; }
.file-pill { position: relative; overflow: hidden; }
.file-pill input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.file-pill:focus-within { outline: 3px solid #7aa7ff; outline-offset: 3px; }
.thumb { width: 22px; height: 22px; border-radius: 6px; background: #444 center/cover; }
button:focus-visible, input:focus-visible { outline: 3px solid #7aa7ff; outline-offset: 3px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; text-align: center; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.grid {
  flex: 1 0 auto; min-height: min(58vh, 560px);
  display: grid; gap: 12px;
  width: 100%; max-width: 720px; margin: 0 auto;
}
.grid[data-n="1"] { grid-template-columns: 1fr; }
.grid[data-n="2"] { grid-template-columns: 1fr 1fr; }
.grid[data-n="3"] { grid-template-columns: 1fr 1fr 1fr; }
.grid[data-n="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

.tile {
  position: relative; overflow: hidden; border-radius: 20px;
  border: 1px solid var(--line); cursor: pointer; padding: 0;
  background: transparent; min-height: 120px; color: inherit; font: inherit;
}
/* the color sits underneath; when covering, the blur glass fades in first, then the color quietly leaves behind it */
.color {
  position: absolute; inset: 0; opacity: 0;
  transition: opacity .25s ease .5s;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px;
}
.color b {
  font-family: var(--body); font-weight: 700; font-size: 14px;
  background: rgba(0,0,0,.35); color: #fff; padding: 5px 12px; border-radius: 999px;
}
.frost {
  position: absolute; inset: 0;
  background: rgba(255, 255, 255, .10);
  backdrop-filter: blur(26px) saturate(1.3); -webkit-backdrop-filter: blur(26px) saturate(1.3);
  display: grid; place-items: center;
  opacity: 1;
  transition: opacity .5s ease;
}
.frost span {
  font-family: var(--display); font-weight: 800; font-size: clamp(28px, 9vw, 54px);
  color: rgba(255,255,255,.9); text-shadow: 0 2px 12px rgba(0,0,0,.35);
}
.color { background: var(--c, transparent); }
.tile.open .color { opacity: 1; transition: opacity .2s ease 0s; }
.tile.open .frost { opacity: 0; }

/* streamer mode: the color stays under the blur glass as a soft glow, no name */
body.streamer .color { background: radial-gradient(circle at 50% 50%, var(--c, transparent) 0 32%, transparent 75%); }

/* history of dropped colors */
.history { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 720px; margin: 0 auto; }
.history-head { display: flex; justify-content: space-between; align-items: center; }
.history-head h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.history-head button { background: none; border: 0; color: var(--muted); font: 700 13px var(--body); cursor: pointer; padding: 6px 4px; }
.rounds { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.round { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 12px; }
.round.current { border-color: rgba(255,255,255,.55); }
.round small { font-family: var(--display); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 2px; }
.round i { width: 18px; height: 18px; border-radius: 5px; display: block; }
.empty { font-size: 13px; color: var(--muted); margin: 0; padding: 8px 0; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
body.streamer .round i { filter: blur(4px); }
body.streamer .tile.open .frost { opacity: 1; }
body.streamer .frost span { transition: opacity .3s ease; }
body.streamer .tile.open .frost span { opacity: 0; }

.reset {
  align-self: center;
  width: 100%; max-width: 420px; height: 58px;
  background: var(--white);
  border: 0; border-radius: 16px; cursor: pointer;
  box-shadow: 0 6px 24px rgba(0,0,0,.3);
  transition: transform .1s;
}
.reset:active { transform: scale(.97); }


/* rarity counters: Легендарка, Мифик, Годли, Эксклюзив */
.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 720px; margin: 0 auto; }
.counter {
  position: relative; overflow: hidden;
  border-radius: 18px; padding: 14px 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0;
  box-shadow: inset 0 3px 0 var(--r1);
}
.counter::before {
  content: ""; position: absolute; inset: -40% -20% auto; height: 90%;
  background: radial-gradient(ellipse at 50% 100%, var(--r1), transparent 65%);
  opacity: .28; pointer-events: none;
}
.rarity {
  position: relative; max-width: 100%; box-sizing: border-box;
  font-family: var(--display); font-weight: 800; font-size: clamp(11px, 3.4vw, 14px);
  letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  padding: 7px 12px; border-radius: 999px; color: #fff;
  background: linear-gradient(135deg, var(--r1), var(--r2));
  text-shadow: 0 1px 2px rgba(0,0,0,.45);
  box-shadow: 0 4px 16px color-mix(in srgb, var(--r1) 45%, transparent);
}
.c-legendary { --r1: #ffcf3a; --r2: #ff8a00; }
.c-mythic    { --r1: #ff3b5c; --r2: #b0124a; }
.c-godly     { --r1: #a855f7; --r2: #4c1d95; }
.c-exclusive { --r1: #ff6fbf; --r2: #ffffff; }
.c-godly .rarity {
  background: linear-gradient(90deg, #4c1d95, #7c3aed, #c084fc, #e9d5ff, #c084fc, #7c3aed, #4c1d95);
  background-size: 250% 100%;
  animation: rainbow 3.5s linear infinite;
}
@keyframes rainbow { to { background-position: 250% 0; } }
.c-exclusive .rarity {
  background: linear-gradient(135deg, #ff5fb8, #ffb3dc 55%, #ffffff);
  border: 1px solid rgba(255, 255, 255, .85);
  color: #8a0f4f;
  text-shadow: 0 1px 0 rgba(255,255,255,.6);
  overflow: hidden;
}
.c-exclusive .rarity::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
  animation: glint 2.8s ease-in-out infinite;
}
@keyframes glint { 60%, 100% { left: 130%; } }
.num {
  position: relative;
  width: 100%; min-width: 0; box-sizing: border-box;
  font-family: var(--display); font-weight: 800; font-size: clamp(18px, 5.4vw, 26px);
  text-align: center; font-variant-numeric: tabular-nums;
  background: rgba(0,0,0,.28); color: var(--fg); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 4px; transition: color .2s;
}
.num.pos { color: #6ff2a8; }
.num.neg { color: #ff8a96; }
.num.bump { animation: bump .25s ease; }
@keyframes bump { 50% { transform: scale(1.08); } }
.steps { position: relative; display: flex; gap: 8px; width: 100%; }
.steps button {
  flex: 1; height: 48px; border-radius: 12px; cursor: pointer; border: 0;
  font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.steps .minus { background: rgba(0,0,0,.35); color: var(--fg); border: 1px solid var(--line); }
.steps .plus { background: var(--white); color: #0e0f14; }
.steps button:active { transform: scale(.94); }
@media (prefers-reduced-motion: reduce) { .c-godly .rarity, .c-exclusive .rarity::after { animation: none; } }

/* animations */
.tile { transition: transform .12s; }
.tile.enter { animation: tileIn .45s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: calc(var(--i, 0) * 70ms); }
.tile:active { transform: scale(.96); }
@keyframes tileIn { from { opacity: 0; transform: scale(.85) translateY(14px); } }
.frost span { animation: qPulse 2.4s ease-in-out infinite; animation-delay: calc(var(--i, 0) * 300ms); display: inline-block; }
@keyframes qPulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: .6; } }
/* covering goes tile by tile */
.tile:not(.open):not(.rolling) .frost { transition-delay: calc(var(--i, 0) * 80ms); }
.tile:not(.open):not(.rolling) .color { transition-delay: calc(.5s + var(--i, 0) * 80ms); }
/* the roll: colors flicker behind a thin glass, then settle */
.tile.rolling .color { opacity: 1; transition: none; }
.tile.rolling .frost { opacity: .35; transition: opacity .2s; }
.tile.rolling .frost span { opacity: 0; }
.tile.rolling .color b { opacity: 0; }
.tile.rolling { animation: shake .12s linear infinite; }
@keyframes shake { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-2px,1px) rotate(-.6deg); } 50% { transform: translate(2px,-1px) rotate(.6deg); } 75% { transform: translate(-1px,-1px) rotate(-.3deg); } }
.tile.landed { animation: land .5s cubic-bezier(.2,.9,.3,1.4); }
@keyframes land { 0% { transform: scale(1.1); } 100% { transform: scale(1); } }
.tile.landed::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 3px rgba(255,255,255,.9); animation: flash .6s ease-out forwards; pointer-events: none; }
@keyframes flash { to { box-shadow: inset 0 0 0 30px rgba(255,255,255,0); } }
.color b { transition: opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.4); }
.tile.open .color b { transform: translateY(0); }
.tile:not(.open) .color b { transform: translateY(10px); }
.round.current i:last-child { animation: dotIn .35s cubic-bezier(.2,.9,.3,1.5); }
@keyframes dotIn { from { transform: scale(0); } }
.reset:active { transform: scale(.95); }

/* streamer mode: every letter on the page goes under blur */
body.streamer h1, body.streamer .hint, body.streamer .picker button, body.streamer .txt,
body.streamer .history-head h2, body.streamer .history-head button, body.streamer .round small, body.streamer .empty,
body.streamer .frost span, body.streamer .rarity {
  filter: blur(7px);
}
h1, .hint, .picker button, .txt, .history-head h2, .history-head button, .round small, .empty, .rarity { transition: filter .3s ease; }
.txt { display: inline-block; }

@media (prefers-reduced-motion: reduce) {
  .frost, .color, .tile.open .color { transition: none; }
  .tile, .tile.rolling, .tile.landed, .frost span, .round.current i:last-child { animation: none; }
  .tile.landed::after { display: none; }
}
</style>
</head>
<body>

<div id="bg"></div>

<header>
  <h1>Elipsi Dice</h1>
  <div class="controls">
    <div class="picker glass" role="group" aria-label="Сколько окошек">
      <button id="n1" data-n="1" aria-pressed="false">1</button>
      <button id="n2" data-n="2" aria-pressed="false">2</button>
      <button id="n3" data-n="3" aria-pressed="false">3</button>
      <button id="n4" data-n="4" aria-pressed="true">4</button>
    </div>
    <label class="pill glass file-pill" for="bgFile">
      <span class="thumb" id="thumb"></span><span class="txt">Фон</span>
      <input type="file" id="bgFile" accept="image/*,image/gif" aria-label="Выбрать фото или GIF для фона">
    </label>
    <button class="pill glass small" id="clearBg" aria-label="Убрать свой фон" hidden><span class="txt">✕</span></button>
    <button class="pill glass" id="streamer" aria-pressed="false"><span class="txt">Стример</span></button>
  </div>
  <p class="hint">Жми на окошко — там случайный цвет. Цвета могут повторяться.</p>
</header>

<main class="grid" id="grid" data-n="4"></main>

<button class="reset" id="reset" aria-label="Замазать всё"></button>

<section class="history" aria-labelledby="histTitle">
  <div class="history-head">
    <h2 id="histTitle">История</h2>
    <button id="clearHist">Очистить</button>
  </div>
  <div class="rounds" id="rounds"></div>
</section>

<section class="counters" aria-label="Редкости">
  <div class="counter glass c-legendary">
    <div class="rarity">Легендарка</div>
    <input class="num" id="num-legendary" type="text" inputmode="numeric" value="0" aria-label="Число: Легендарка">
    <div class="steps">
      <button class="minus" id="minus-legendary" aria-label="Легендарка минус 1">−</button>
      <button class="plus" id="plus-legendary" aria-label="Легендарка плюс 1">+</button>
    </div>
  </div>
  <div class="counter glass c-mythic">
    <div class="rarity">Мифик</div>
    <input class="num" id="num-mythic" type="text" inputmode="numeric" value="0" aria-label="Число: Мифик">
    <div class="steps">
      <button class="minus" id="minus-mythic" aria-label="Мифик минус 1">−</button>
      <button class="plus" id="plus-mythic" aria-label="Мифик плюс 1">+</button>
    </div>
  </div>
  <div class="counter glass c-godly">
    <div class="rarity">Годли</div>
    <input class="num" id="num-godly" type="text" inputmode="numeric" value="0" aria-label="Число: Годли">
    <div class="steps">
      <button class="minus" id="minus-godly" aria-label="Годли минус 1">−</button>
      <button class="plus" id="plus-godly" aria-label="Годли плюс 1">+</button>
    </div>
  </div>
  <div class="counter glass c-exclusive">
    <div class="rarity">Эксклюзив</div>
    <input class="num" id="num-exclusive" type="text" inputmode="numeric" value="0" aria-label="Число: Эксклюзив">
    <div class="steps">
      <button class="minus" id="minus-exclusive" aria-label="Эксклюзив минус 1">−</button>
      <button class="plus" id="plus-exclusive" aria-label="Эксклюзив плюс 1">+</button>
    </div>
  </div>
</section>


<script>
const COLORS = [
  { id: "blue",   name: "Синий",      hex: "#2f7bff" },
  { id: "red",    name: "Красный",    hex: "#ff3b4e" },
  { id: "green",  name: "Зелёный",    hex: "#2ed47a" },
  { id: "purple", name: "Фиолетовый", hex: "#a855f7" },
  { id: "yellow", name: "Жёлтый",     hex: "#ffd23f" },
  { id: "orange", name: "Оранжевый",  hex: "#ff8a1f" }
];

const grid = document.getElementById("grid");
let count = 4;

// a color already open in this round gets half the chance, so repeats happen but not every time
const repeatFactor = 0.5;

// strong randomness from the browser's crypto generator (not the usual Math.random)
function rand() {
  try {
    const a = new Uint32Array(2);
    crypto.getRandomValues(a);
    return (a[0] * 2097152 + (a[1] >>> 11)) / 9007199254740992;
  } catch (e) { return Math.random(); }
}

function randomColor() {
  const shown = {};
  grid.querySelectorAll(".tile.open, .tile.rolling").forEach(t => { const id = t.dataset.color; if (id) shown[id] = (shown[id] || 0) + 1; });
  const w = COLORS.map(c => Math.pow(repeatFactor, shown[c.id] || 0));
  const total = w.reduce((s, x) => s + x, 0);
  let r = rand() * total;
  for (let i = 0; i < COLORS.length; i++) {
    r -= w[i];
    if (r < 0) return COLORS[i];
  }
  return COLORS[COLORS.length - 1];
}

function makeTile(i) {
  const t = document.createElement("button");
  t.className = "tile";
  t.setAttribute("aria-label", "Окошко " + (i + 1) + ", замазано");
  t.style.setProperty("--i", i);
  t.classList.add("enter");
  t.addEventListener("animationend", e => { if (e.animationName === "tileIn") t.classList.remove("enter"); });
  t.innerHTML = '<div class="color"><b></b></div><div class="frost"><span>?</span></div>';
  t.addEventListener("click", () => {
    if (t.classList.contains("open") || t.classList.contains("rolling")) return;
    const c = randomColor();
    const layer = t.querySelector(".color");
    const label = layer.querySelector("b");
    t.dataset.color = c.id;
    t.classList.remove("enter", "landed");
    const token = {};
    t._roll = token;

    const finish = () => {
      if (t._roll !== token) return;
      t._roll = null;
      layer.style.setProperty("--c", c.hex);
      label.textContent = c.name;
      t.classList.remove("rolling");
      t.classList.add("open");
      void t.offsetWidth;
      t.classList.add("landed");
      logColor(c.id);
      t.setAttribute("aria-label", "Окошко " + (i + 1) + ": " + c.name);
    };

    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { finish(); return; }

    // slot-machine roll: colors flicker fast, then slow down and land on the real one
    t.classList.add("rolling");
    label.textContent = "";
    const steps = [45, 45, 50, 55, 60, 70, 80, 95, 115, 140, 175, 220];
    let prev = null, k = 0;
    const tick = () => {
      if (t._roll !== token) return;
      if (k >= steps.length) { finish(); return; }
      let pick;
      do { pick = COLORS[Math.floor(rand() * COLORS.length)]; } while (pick === prev);
      prev = pick;
      layer.style.setProperty("--c", pick.hex);
      setTimeout(tick, steps[k++]);
    };
    tick();
  });
  return t;
}

/* history: one round = colors opened between two "cover all" presses */
const BY_ID = {};
COLORS.forEach(c => BY_ID[c.id] = c);
let rounds = [];
let roundNo = 0;
let roundOpen = false;
try {
  const h = JSON.parse(localStorage.getItem("okoshki-history") || "null");
  if (h && Array.isArray(h.rounds)) { rounds = h.rounds.filter(r => r && Array.isArray(r.colors)); roundNo = h.no || rounds.length; }
} catch (e) {}
function saveHistory() { try { localStorage.setItem("okoshki-history", JSON.stringify({ rounds, no: roundNo })); } catch (e) {} }

function renderHistory() {
  const box = document.getElementById("rounds");
  if (!rounds.length) { box.innerHTML = '<p class="empty">Пока пусто. Открой окошко, и цвет появится здесь.</p>'; return; }
  box.innerHTML = rounds.map((r, i) => {
    const names = r.colors.map(id => BY_ID[id] ? BY_ID[id].name : id).join(", ");
    const dots = r.colors.map(id => '<i style="background:' + (BY_ID[id] ? BY_ID[id].hex : "#666") + '"></i>').join("");
    return '<div class="round glass' + (i === 0 && roundOpen ? " current" : "") + '" title="' + names + '"><small>#' + r.n + '</small>' + dots + '</div>';
  }).join("");
}

function logColor(id) {
  if (!roundOpen) {
    roundNo++;
    rounds.unshift({ n: roundNo, colors: [] });
    rounds = rounds.slice(0, 40);
    roundOpen = true;
  }
  rounds[0].colors.push(id);
  saveHistory();
  renderHistory();
  document.getElementById("rounds").scrollLeft = 0;
}

function closeRound() {
  if (!roundOpen) return;
  roundOpen = false;
  renderHistory();
}

document.getElementById("clearHist").addEventListener("click", () => {
  rounds = []; roundNo = 0; roundOpen = false;
  saveHistory();
  renderHistory();
});

function build() {
  closeRound();
  grid.dataset.n = count;
  grid.innerHTML = "";
  for (let i = 0; i < count; i++) grid.appendChild(makeTile(i));
}

document.querySelectorAll(".picker button").forEach(b => {
  b.addEventListener("click", () => {
    count = Number(b.dataset.n);
    document.querySelectorAll(".picker button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    build();
  });
});

document.getElementById("reset").addEventListener("click", () => {
  closeRound();
  grid.querySelectorAll(".tile").forEach((t, i) => {
    t._roll = null;
    if (t.classList.contains("rolling")) delete t.dataset.color;
    t.classList.remove("open", "rolling", "landed");
    t.setAttribute("aria-label", "Окошко " + (i + 1) + ", замазано");
  });
});

/* background photo / GIF */
const bg = document.getElementById("bg");
const thumb = document.getElementById("thumb");
const clearBtn = document.getElementById("clearBg");
const fileIn = document.getElementById("bgFile");

let currentObjUrl = null;
function applyBg(url) {
  if (url) {
    bg.style.backgroundImage = "url(" + JSON.stringify(url) + ")";
    bg.classList.add("photo");
    thumb.style.backgroundImage = "url(" + JSON.stringify(url) + ")";
    clearBtn.hidden = false;
  } else {
    bg.style.backgroundImage = "";
    bg.classList.remove("photo");
    thumb.style.backgroundImage = "";
    clearBtn.hidden = true;
  }
}
try { const s = localStorage.getItem("okoshki-bg"); if (s) applyBg(s); } catch (e) {}

fileIn.addEventListener("change", () => {
  const f = fileIn.files && fileIn.files[0];
  if (!f) return;
  // show it right away from a blob link (fast, GIFs keep moving)
  if (currentObjUrl) URL.revokeObjectURL(currentObjUrl);
  currentObjUrl = URL.createObjectURL(f);
  applyBg(currentObjUrl);
  // remember it for next time only if it fits in browser storage
  try { localStorage.removeItem("okoshki-bg"); } catch (e) {}
  if (f.size < 3.5 * 1024 * 1024) {
    const reader = new FileReader();
    reader.onload = () => { try { localStorage.setItem("okoshki-bg", reader.result); } catch (e) {} };
    reader.readAsDataURL(f);
  }
  fileIn.value = "";
});
clearBtn.addEventListener("click", () => {
  applyBg(null);
  if (currentObjUrl) { URL.revokeObjectURL(currentObjUrl); currentObjUrl = null; }
  try { localStorage.removeItem("okoshki-bg"); } catch (e) {}
});

/* streamer mode */
const streamBtn = document.getElementById("streamer");
function setStreamer(on) {
  document.body.classList.toggle("streamer", on);
  streamBtn.setAttribute("aria-pressed", on ? "true" : "false");
  try { localStorage.setItem("okoshki-streamer", on ? "1" : "0"); } catch (e) {}
}
try { if (localStorage.getItem("okoshki-streamer") === "1") setStreamer(true); } catch (e) {}
streamBtn.addEventListener("click", () => setStreamer(!document.body.classList.contains("streamer")));


/* rarity counters, from −1 000 000 to 1 000 000 */
const LIMIT = 1000000;
const counts = { legendary: 0, mythic: 0, godly: 0, exclusive: 0 };
try {
  const s = JSON.parse(localStorage.getItem("elipsi-rarity-counts") || "null");
  if (s) Object.keys(counts).forEach(k => { if (typeof s[k] === "number") counts[k] = s[k]; });
} catch (e) {}
function saveCounts() { try { localStorage.setItem("elipsi-rarity-counts", JSON.stringify(counts)); } catch (e) {} }

function fmt(n) {
  const s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (n < 0 ? "−" : "") + s;
}
function clamp(n) { return Math.max(-LIMIT, Math.min(LIMIT, n)); }

function showCount(key, bump) {
  const el = document.getElementById("num-" + key);
  if (document.activeElement !== el) el.value = fmt(counts[key]);
  el.classList.toggle("pos", counts[key] > 0);
  el.classList.toggle("neg", counts[key] < 0);
  if (bump) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}

function change(key, delta) {
  const next = clamp(counts[key] + delta);
  if (next === counts[key]) return;
  counts[key] = next;
  showCount(key, true);
  saveCounts();
}

Object.keys(counts).forEach(key => {
  const input = document.getElementById("num-" + key);
  input.addEventListener("focus", () => { input.value = counts[key] === 0 ? "" : String(counts[key]); });
  input.addEventListener("input", () => { input.value = input.value.replace(/[^\d\-−]/g, ""); });
  const commit = () => {
    const raw = input.value.replace(/−/g, "-").replace(/\s/g, "");
    const n = parseInt(raw, 10);
    counts[key] = isNaN(n) ? counts[key] : clamp(n);
    saveCounts();
    input.value = fmt(counts[key]);
    showCount(key, false);
  };
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });

  [["plus", 1], ["minus", -1]].forEach(([kind, dir]) => {
    const btn = document.getElementById(kind + "-" + key);
    let holdTimer = null, repeatTimer = null, n = 0;
    const stop = () => { clearTimeout(holdTimer); clearInterval(repeatTimer); holdTimer = repeatTimer = null; };
    btn.addEventListener("pointerdown", e => {
      e.preventDefault();
      stop();
      change(key, dir);
      n = 0;
      // hold to speed up: 1 → 10 → 100 → 1 000 → 10 000 per tick
      holdTimer = setTimeout(() => {
        repeatTimer = setInterval(() => {
          n++;
          const step = n < 15 ? 1 : n < 30 ? 10 : n < 45 ? 100 : n < 60 ? 1000 : 10000;
          change(key, dir * step);
        }, 70);
      }, 400);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener("contextmenu", e => e.preventDefault());
    btn.addEventListener("click", e => { if (e.detail === 0) change(key, dir); }); // keyboard
  });
  showCount(key, false);
});

build();
renderHistory();
</script>
